[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mfa-portal"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
dev = "api.dev:main"

[tool.hatch.build.targets.wheel]
packages = ["api"]
